[package]
name = "autocue-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
description = "On-the-fly audio cue-in, cue-out, overlay and EBU R128 loudness analysis for AutoDJ software. Rust port of autocue (Moonbase59/cue_file)."
keywords = ["audio", "autodj", "loudness", "cue", "ffmpeg"]
categories = ["multimedia", "command-line-utilities"]
readme = "README.md"

[lib]
name = "autocue_rs"
path = "src/lib.rs"

[[bin]]
name = "autocue-rs"
path = "src/bin/autocue-rs.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
lofty = "0.25.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[dev-dependencies]
tempfile = "3"
